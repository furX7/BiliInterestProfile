name: Phase 1 engineering gates

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with PR base history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.19.0'
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier on PR changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm format:check -- "$PR_BASE_SHA"

      - name: TypeScript
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Fixture golden tests
        run: pnpm test:golden

      - name: Chrome production build
        run: pnpm exec wxt build -b chrome

      - name: Edge production build
        run: pnpm exec wxt build -b edge

      - name: Build-dependent integration tests
        run: pnpm test:integration

      - name: Chrome and Edge bundle budgets
        run: pnpm bundle:check
